name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - skillex-0.9

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm skillex:refresh
      - run: pnpm skillex:verify
      - run: pnpm skillex:check
      - name: Verify application source parity
        run: |
          git fetch origin main --depth=1
          git diff --exit-code origin/main -- +            apps/admin/src +            apps/storefront/src +            packages/api-client/src +            packages/commerce-workflows/src +            packages/design-system/src +            vendor/design-system-v2/src
