version: 1
project:
  name: demo-skillex-monorepo
  packageManager: pnpm
  thesis: "Resolve applicable skills by path, dependency, version, and audience."

sources:
  - id: root
    path: skills
    audience: all
    priority: baseline

  - id: admin-app
    path: apps/admin/skills
    appliesTo:
      paths:
        - apps/admin/**
      framework:
        name: next
        version: "15"
      dependencies:
        "@demo/design-system": "2.x"
    audience: app-consumer
    priority: scoped

  - id: storefront-app
    path: apps/storefront/skills
    appliesTo:
      paths:
        - apps/storefront/**
      framework:
        name: next
        version: "16"
      dependencies:
        "@demo/design-system": "3.x"
    audience: app-consumer
    priority: scoped

  - id: design-system-v3-public
    path: packages/design-system/skills/public
    package:
      name: "@demo/design-system"
      version: "3.x"
    appliesTo:
      consumers:
        - apps/storefront/**
    audience: consumer
    priority: dependency

  - id: design-system-v3-private
    path: packages/design-system/skills/private
    package:
      name: "@demo/design-system"
      version: "3.x"
    appliesTo:
      paths:
        - packages/design-system/**
    audience: maintainer
    priority: owner

  - id: design-system-v2-public
    path: vendor/design-system-v2/skills/public
    package:
      name: "@demo/design-system"
      version: "2.x"
    appliesTo:
      consumers:
        - apps/admin/**
    audience: consumer
    priority: dependency

resolution:
  order:
    - currentPath
    - packageDependency
    - packageVersion
    - audience
    - topic
  fallback:
    includeRootSkills: true
    markRootSkillsAsBaseline: true
